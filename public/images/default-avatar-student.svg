<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
    <defs>
        <linearGradient id="bgGradStudent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E2E8F0"/>
            <stop offset="100%" stop-color="#CBD5E1"/>
        </linearGradient>
        <linearGradient id="shirtGradStudent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>
        <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#94A3B8"/>
            <stop offset="100%" stop-color="#64748B"/>
        </linearGradient>
    </defs>
    <!-- Background Circle -->
    <circle cx="60" cy="60" r="60" fill="url(#bgGradStudent)"/>
    
    <!-- Outer Ring Border subtle -->
    <circle cx="60" cy="60" r="58.5" stroke="#94A3B8" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Body / Shoulders -->
    <path d="M22 106 C22 84 38 74 60 74 C82 74 98 84 98 106 C98 114 90 120 60 120 C30 120 22 114 22 106 Z" fill="url(#shirtGradStudent)"/>
    
    <!-- Uniform Collar Detail -->
    <path d="M52 74 L60 86 L68 74 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M56 86 L60 102 L64 86 Z" fill="#1E40AF"/>

    <!-- Neck -->
    <rect x="52" y="60" width="16" height="18" rx="4" fill="url(#skinGrad)"/>

    <!-- Head -->
    <ellipse cx="60" cy="46" rx="20" ry="22" fill="url(#skinGrad)"/>

    <!-- Hair (neat student cut) -->
    <path d="M40 44 C40 28 48 22 60 22 C72 22 80 28 80 44 C80 34 74 27 60 27 C46 27 40 34 40 44 Z" fill="#334155"/>
    <path d="M38 42 C38 32 44 24 60 24 C68 24 76 28 78 34 C74 31 67 30 60 30 C50 30 43 35 38 42 Z" fill="#1E293B"/>

    <!-- Gentle Ear Accents -->
    <circle cx="39" cy="47" r="3.5" fill="url(#skinGrad)"/>
    <circle cx="81" cy="47" r="3.5" fill="url(#skinGrad)"/>
</svg>
